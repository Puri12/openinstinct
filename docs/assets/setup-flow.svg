<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
    <style>
      .step { fill: #1c1c1e; stroke: #3a3a3c; stroke-width: 1.5; rx: 12; }
      .n { fill: #30d158; font-size: 13px; font-weight: 700; }
      .t { fill: #f5f5f7; font-size: 14px; font-weight: 600; }
      .s { fill: #a1a1a6; font-size: 12px; }
      .e { stroke: #8a8f98; stroke-width: 1.5; marker-end: url(#a); }
      .where { fill: #636366; font-size: 11px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <text class="where" x="90" y="24" text-anchor="middle">ONCE, 5 MIN</text>
  <text class="where" x="480" y="24" text-anchor="middle">MENU BAR CHECKLIST · EACH STEP TURNS GREEN ON ITS OWN</text>

  <rect class="step" x="20" y="40" width="140" height="80"/>
  <text class="n" x="34" y="62">0</text>
  <text class="t" x="34" y="84">Apple ID for OmO</text>
  <text class="s" x="34" y="104">any email, free</text>

  <line class="e" x1="160" y1="80" x2="190" y2="80"/>

  <rect class="step" x="190" y="40" width="120" height="80"/>
  <text class="n" x="204" y="62">1</text>
  <text class="t" x="204" y="84">Who you are</text>
  <text class="s" x="204" y="104">your number</text>

  <line class="e" x1="310" y1="80" x2="330" y2="80"/>

  <rect class="step" x="330" y="40" width="130" height="80"/>
  <text class="n" x="344" y="62">2</text>
  <text class="t" x="344" y="84">OmO's iMessage</text>
  <text class="s" x="344" y="104">sign Messages in</text>

  <line class="e" x1="460" y1="80" x2="480" y2="80"/>

  <rect class="step" x="480" y="40" width="120" height="80"/>
  <text class="n" x="494" y="62">3</text>
  <text class="t" x="494" y="84">Full Disk Access</text>
  <text class="s" x="494" y="104">one toggle</text>

  <line class="e" x1="600" y1="80" x2="620" y2="80"/>

  <rect class="step" x="620" y="40" width="110" height="80"/>
  <text class="n" x="634" y="62">4</text>
  <text class="t" x="634" y="84">Automation</text>
  <text class="s" x="634" y="104">click Allow</text>

  <line class="e" x1="730" y1="80" x2="750" y2="80"/>

  <rect class="step" x="750" y="40" width="100" height="80"/>
  <text class="n" x="764" y="62">5</text>
  <text class="t" x="764" y="84">AI account</text>
  <text class="s" x="764" y="104">sign in</text>

  <line class="e" x1="850" y1="80" x2="870" y2="80"/>

  <rect class="step" x="870" y="40" width="70" height="80"/>
  <text class="n" x="884" y="62">6</text>
  <text class="t" x="884" y="84">Text it</text>
  <text class="s" x="884" y="104">done</text>
</svg>
